function uid(){

  bytes[6]=(bytes[6]&0x0f)|0x40; bytes[8]=(bytes[8]&0x3f)|0x80;

  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function minutesToTime(minutes){ const safe=Math.max(0,Math.min(24*60-1,Math.round(Number(minutes)||0))); return `${String(Math.floor(safe/60)).padStart(2,'0')}:${String(safe%60).padStart(2,'0')}`; }

function calendarDays(month){
  const [y,m]=month.split('-').map(Number); const first=new Date(y,m-1,1); const days=new Date(y,m,0).getDate();
  const mondayOffset=(first.getDay()+6)%7; const out=[];
  for(let i=0;i<mondayOffset;i++){ const d=new Date(y,m-1,1-mondayOffset+i); out.push({date:localDate(d),current:false}); }
  for(let day=1;day<=days;day++) out.push({date:localDate(new Date(y,m-1,day)),current:true});

  return out;
}

}

const ACTIVE_STORES=['tasks','memos','weeklyWorkoutPlans','workouts','workoutExercises','workoutSets','bodyMetrics','foodEntries','favoriteFoods','stockWatchlist','stockHoldings','stockTrades','stockSectors','stockNotes','settings'];

function validateBackupObject(obj){

  for(const s of required){ if(!Array.isArray(obj.data[s])) return {ok:false,error:`备份缺少数据表：${s}`}; }

}

const DB=(()=>{

const STORE_NAMES = ACTIVE_STORES;
const DB_NAME='lifedesk-db'; const DB_VERSION=5; const LS_KEY='lifedesk-local-db-v2'; const OLD_LS_KEY='lifedesk-local-db-v1'; const MANUAL_SAVE_KEY='lifedesk-manual-save-v1'; const META_STORE='__meta';

function readLocal(){

  if(!raw)return blankLocal();
  try{const parsed=JSON.parse(raw),data=blankLocal();for(const s of STORE_NAMES)if(Array.isArray(parsed[s]))data[s]=parsed[s];data.tasks=(data.tasks||[]).map(t=>t.module==='consulting'||t.sourceType==='consultingAction'?{...t,module:'',sourceType:null,sourceId:null}:t);return data;}catch{return blankLocal();}

const PLANNER_START=6*60, PLANNER_END=24*60, PLANNER_STEP=30;

function plannerDateLabel(date){const d=new Date(`${date}T12:00:00`);return `${d.getMonth()+1}月${d.getDate()}日`;}
function plannerRangeLabel(dates){if(dates.length===1)return formatDateCN(dates[0]);const a=new Date(`${dates[0]}T12:00:00`),b=new Date(`${dates.at(-1)}T12:00:00`);return a.getMonth()===b.getMonth()?`${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日 – ${b.getDate()}日`:`${plannerDateLabel(dates[0])} – ${plannerDateLabel(dates.at(-1))}`;}

function plannerTimeline(tasks,dates){
  const slots=plannerSlots(PLANNER_START,PLANNER_END,PLANNER_STEP),columns=dates.length;
  const scheduled=tasks.filter(t=>t.time&&timeToMinutes(t.time)>=PLANNER_START&&timeToMinutes(t.time)<PLANNER_END);
  const header=`<div class="planner-grid-head" style="--planner-days:${columns}"><div class="planner-zone">GMT+8</div>${dates.map((date,i)=>{const d=new Date(`${date}T12:00:00`),today=date===localDate();return `<button class="planner-day-head ${today?'today':''} ${date===state.todayAnchor?'selected':''}" data-action="planner-date" data-date="${date}"><span>周${plannerWeekdays[i+(columns===1?((d.getDay()+6)%7)-i:0)]||plannerWeekdays[(d.getDay()+6)%7]}</span><strong>${d.getDate()}</strong></button>`}).join('')}</div>`;
  const cells=[];
  for(let r=0;r<slots.length;r++){
    const time=slots[r],show=time.endsWith(':00');cells.push(`<div class="planner-time-label ${show?'hour':''}" style="grid-column:1;grid-row:${r+1}">${show?time:''}</div>`);
    dates.forEach((date,c)=>cells.push(`<div class="planner-slot ${show?'hour':''}" data-planner-slot="1" data-date="${date}" data-time="${time}" style="grid-column:${c+2};grid-row:${r+1}"></div>`));
  }
  const blocks=scheduled.map(t=>plannerTaskBlock(t,dates.indexOf(t.date),slots)).filter(x=>!x.includes('grid-column:1;')).join('');
  return `<div class="planner-calendar-panel"><div class="planner-scroll">${header}<div class="planner-time-grid" style="--planner-days:${columns};--planner-rows:${slots.length}">${cells.join('')}${blocks}</div></div></div>`;
}

async function refreshStockQuotes({showToast=false}={}){
  if(state.quoteRefreshing)return;
  const d=await snapshot(),codes=[...new Set([...d.stockWatchlist.filter(x=>(x.market||'A股')==='A股').map(x=>x.code),...d.stockHoldings.map(x=>x.code)].map(x=>String(x||'').trim()).filter(x=>/^\d{6}$/.test(x)))];
  if(!codes.length){state.quoteError='暂无可刷新的 A 股代码';if(showToast)toast(state.quoteError);return;}
  state.quoteRefreshing=true;state.quoteError='';if(state.page==='stocks')await render();
  const results=await Promise.allSettled(codes.map(async code=>[code,await fetchPublicStockQuote(code)]));let success=0;
  for(const r of results){if(r.status!=='fulfilled')continue;const [code,q]=r.value;state.liveQuotes[code]=q;success++;const holdings=d.stockHoldings.filter(h=>String(h.code||'').trim()===code);for(const h of holdings)await DB.update('stockHoldings',h.id,{currentPrice:q.price,priceUpdatedAt:q.timestamp,quoteSource:'eastmoney'});}
  state.quoteRefreshing=false;state.quoteLastUpdated=nowIso();
  if(!success)state.quoteError='行情获取失败，请检查网络后重试';else if(success<codes.length)state.quoteError=`${codes.length-success} 只股票暂未更新`;
  if(state.page==='stocks')await render();if(showToast)toast(success?`已更新 ${success} 只股票行情`:state.quoteError);
}
function manageStockQuotePolling(){
  if(state.page!=='stocks'){if(stockQuoteTimer){clearInterval(stockQuoteTimer);stockQuoteTimer=null;}return;}
  if(!stockQuoteTimer)stockQuoteTimer=setInterval(()=>refreshStockQuotes(),STOCK_QUOTE_INTERVAL_MS);
  const stale=!state.quoteLastUpdated||(Date.now()-new Date(state.quoteLastUpdated).getTime()>STOCK_QUOTE_INTERVAL_MS-1000);
  if(stale&&!state.quoteRefreshing)setTimeout(()=>refreshStockQuotes(),80);
}

ead"><div><span class="panel-kicker">FAVORITES</span><h2>常用食物</h2></div></div><div class="favorite-grid">${d.favoriteFoods.length?d.favoriteFoods.map(f=>`<button class="favorite-food" data-action="favorite-add" data-id="${f.id}" data-date="${selected}"><strong>${escapeHtml(f.name)}</strong><span>${f.calories} kcal · P ${f.protein}g</span><b>＋</b></button>`).join(''):empty('把常吃的食物保存到这里')}</div></div></section>`;

async function render(){
  const seq=++renderSeq;state.page=currentPage();await DB.ensureDefaults();const d=await snapshot();if(seq!==renderSeq)return;applyTheme(d.settings.find(x=>x.id==='app')?.theme||'system');
  let content;switch(state.page){case'today':content=await renderToday(d);break;case'stocks':content=await renderStocks(d);break;case'fitness':content=await renderFitness(d);break;case'nutrition':content=await renderNutrition(d);break;case'settings':content=await renderSettings(d);break;default:content=await renderDashboard(d);}if(seq!==renderSeq)return;app.innerHTML=shell(content);bindEvents();if(state.searchOpen)renderSearch(d);manageStockQuotePolling();
}
function applyTheme(theme){document.documentElement.dataset.theme=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;}

async function deleteWorkoutCascade(id){const exercises=await DB.query('workoutExercises',x=>x.workoutId===id);const ids=new Set(exercises.map(x=>x.id));const sets=await DB.query('workoutSets',x=>ids.has(x.exerciseId));for(const set of sets)await DB.remove('workoutSets',set.id);for(const ex of exercises)await DB.remove('workoutExercises',ex.id);await DB.remove('workouts',id);if(state.activeWorkoutId===id)state.activeWorkoutId=null;return {exerciseCount:exercises.length,setCount:sets.length};}
async function editFitnessPlan(){const plans=await DB.list('weeklyWorkoutPlans'),labels=['周日','周一','周二','周三','周四','周五','周六'],order=[1,2,3,4,5,6,0];openModal('编辑周训练模板',`<div class="list">${order.map(day=>{const p=plans.find(x=>Number(x.weekday)===day);return `<div class="plan-edit-row"><strong>${labels[day]}</strong><input class="input" name="title-${day}" placeholder="例如：背 + 二头" value="${escapeHtml(p?.title||'')}"><label><input type="checkbox" name="rest-${day}" ${p?.isRestDay?'checked':''}> 休息</label></div>`}).join('')}</div>`,async fd=>{for(const day of order){const existing=plans.find(x=>Number(x.weekday)===day),data={weekday:day,title:fd.get(`title-${day}`)||'',isRestDay:fd.get(`rest-${day}`)==='on'};if(existing)await DB.update('weeklyWorkoutPlans',existing.id,data);else await DB.add('weeklyWorkoutPlans',data);}});}

function searchResultsFor(d,query){const q=String(query||'').trim().toLowerCase(),results=[],add=(type,page,title)=>{if(!q||String(title).toLowerCase().includes(q))results.push({type,page,title});};d.tasks.forEach(x=>add('任务','today',x.title));d.memos.forEach(x=>add('备忘','dashboard',x.content));d.stockWatchlist.forEach(x=>add('自选股','stocks',`${x.code} ${x.name}`));d.stockHoldings.forEach(x=>add('持仓','stocks',`${x.code} ${x.name}`));d.stockSectors.forEach(x=>add('板块','stocks',x.name));d.stockNotes.forEach(x=>add('股票复盘','stocks',x.title));return {q,results};}

async function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>navTo(el.dataset.nav));
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{const a=el.dataset.action;try{
    if(a==='search-toggle'){state.searchOpen=!state.searchOpen;await render();}
    else if(a==='manual-save'){const info=await DB.saveManualSnapshot();const time=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'}).format(new Date(info.savedAt));toast(`已手动保存 · ${time}`);}
    else if(a==='quick-add')quickAdd();
    else if(a==='task-new')newTask({date:state.page==='today'?state.todayAnchor:localDate()});
    else if(a==='planner-new')newTask({date:state.todayAnchor});
    else if(a==='planner-view'){state.todayView=el.dataset.view;await render();}
    else if(a==='planner-mode'){state.todayMode=el.dataset.mode;await render();}
    else if(a==='planner-today'){state.todayAnchor=localDate();state.todayMiniMonth=monthKey();await render();}
    else if(a==='planner-nav'){const step=state.todayMode==='week'?7:1;state.todayAnchor=shiftDate(state.todayAnchor,Number(el.dataset.delta)*step);state.todayMiniMonth=monthKey(state.todayAnchor);await render();}
    else if(a==='planner-date'){state.todayAnchor=el.dataset.date;state.todayMiniMonth=monthKey(el.dataset.date);await render();}
    else if(a==='planner-mini-month-shift'){state.todayMiniMonth=shiftMonth(state.todayMiniMonth,Number(el.dataset.delta));await render();}
    else if(a==='task-toggle'){const t=await DB.get('tasks',el.dataset.id);await DB.update('tasks',t.id,{completed:!t.completed});await render();}
    else if(a==='task-detail')taskDetail(el.dataset.id);

function bindDragAndDrop(){let draggedTask=null;document.querySelectorAll('.task-row[data-task-id]').forEach(row=>{row.ondragstart=()=>draggedTask=row.dataset.taskId;row.ondragover=e=>e.preventDefault();row.ondrop=async e=>{e.preventDefault();if(!draggedTask||draggedTask===row.dataset.taskId)return;const date=row.dataset.taskDate||state.todayAnchor,tasks=(await DB.query('tasks',x=>x.date===date)).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)),from=tasks.findIndex(x=>x.id===draggedTask),to=tasks.findIndex(x=>x.id===row.dataset.taskId);if(from<0||to<0)return;const[moved]=tasks.splice(from,1);tasks.splice(to,0,moved);for(let i=0;i<tasks.length;i++)await DB.update('tasks',tasks[i].id,{sortOrder:i});await render();};});}
function bindPlannerDragAndDrop(){
  let draggedTask=null;
  const cleanup=()=>{document.body.classList.remove('planner-dragging');document.querySelectorAll('.planner-drop-active').forEach(x=>x.classList.remove('planner-drop-active'));};
  document.querySelectorAll('[data-planner-task]').forEach(card=>{card.ondragstart=e=>{draggedTask=card.dataset.plannerTask;document.body.classList.add('planner-dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTask);}};card.ondragend=cleanup;});
  document.querySelectorAll('[data-planner-slot]').forEach(slot=>{slot.ondragover=e=>{if(!draggedTask)return;e.preventDefault();slot.classList.add('planner-drop-active');if(e.dataTransfer)e.dataTransfer.dropEffect='move';};slot.ondragleave=()=>slot.classList.remove('planner-drop-active');slot.ondrop=async e=>{e.preventDefault();slot.classList.remove('planner-drop-active');if(!draggedTask)return;await DB.update('tasks',draggedTask,{date:slot.dataset.date,time:slot.dataset.time});state.todayAnchor=slot.dataset.date;state.todayMiniMonth=monthKey(slot.dataset.date);cleanup();await render();toast(`已安排到 ${slot.dataset.time}`);};});
  const tray=document.querySelector('[data-unscheduled-drop]');if(tray){tray.ondragover=e=>{if(!draggedTask)return;e.preventDefault();tray.classList.add('planner-drop-active');};tray.ondragleave=e=>{if(!tray.contains(e.relatedTarget))tray.classList.remove('planner-drop-active');};tray.ondrop=async e=>{e.preventDefault();tray.classList.remove('planner-drop-active');if(!draggedTask)return;await DB.update('tasks',draggedTask,{time:''});cleanup();await render();toast('已移到待安排');};}

}
async function importBackup(e){const file=e.target.files?.[0];if(!file)return;let obj;try{obj=JSON.parse(await file.text());}catch{toast('导入失败：文件无法解析');return;}const valid=validateBackupObject(obj);if(!valid.ok){toast(`导入失败：${valid.error}`);return;}const normalized=normalizeBackup(obj);openModal('确认恢复',`<p class="confirm-copy">备份版本：V${obj.formatVersion}<br>备份时间：${escapeHtml(obj.exportedAt||'未知')}</p><p class="support-copy">恢复将替换当前数据。旧 V1 备份会自动迁移到 V2。</p>`,async()=>{await DB.replaceAll(normalized);toast('数据已完整恢复');},'恢复');}
